name: ci

on:
  push:
    branches: [develop, qa, main, fix/root-composition-integration]
  pull_request:
    branches: [develop, qa, main]

jobs:
  check-common-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --coverage
      - run: npm run check:compiled

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: docker build --build-arg VITE_BASE_PATH=/remotes/sales/ -f deploy/Dockerfile -t synkro-sales-portal:prefixed .
      - run: docker build -f deploy/Dockerfile -t synkro-sales-portal:ci .
      - run: docker run --rm -e HOST_ORIGIN=https://host.example synkro-sales-portal:ci nginx -t

  consumer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:contract
      - name: Verify committed consumer artifacts are current
        run: git diff --exit-code -- tests/pact/pacts
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-pacts-${{ github.sha }}
          path: tests/pact/pacts/*.json
