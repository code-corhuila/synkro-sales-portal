# This portal alone. The composition of the whole system lives in synkro-infra.
# Run it with the values of a .env that is never committed:
#   docker compose --env-file .env -f deploy/compose.yml up --build   # internal platform HTTP 80; browser delivery through the host
services:
  synkro-sales-portal:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/remotes/sales/}
        VITE_SHELL_ENTRY_URL: ${VITE_SHELL_ENTRY_URL:-http://localhost:5173/assets/remoteEntry.js}
        # ':-' so an empty variable never blanks a confirmed value. Quoted: '#' starts a YAML comment.
        VITE_ISSUER_LEGAL_NAME: "${VITE_ISSUER_LEGAL_NAME:-synkro tech sas}"
        VITE_ISSUER_TAX_ID: "${VITE_ISSUER_TAX_ID:-803.256.942-7}"
        VITE_ISSUER_ADDRESS: "${VITE_ISSUER_ADDRESS:-CRA 7 # 34-56}"
        VITE_ISSUER_PHONE: "${VITE_ISSUER_PHONE:-3104662443}"
        VITE_ISSUER_EMAIL: "${VITE_ISSUER_EMAIL:-RECEPCION@SYNKROTECH.COM}"
    environment:
      HOST_ORIGIN: ${HOST_ORIGIN:-http://localhost:5173}
    expose: ["80"]
    networks: [platform]

networks:
  platform:
    external: true
